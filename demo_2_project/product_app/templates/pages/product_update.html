{% extends 'master/base.html' %}

{% block content %}

<div class="container">

    <h2>Update Product</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}


        <div class="mb-3">
            <label>Product Name</label>

            <input type="text" name="name" value="{{ product.name }}" class="form-control"required>
        </div>


        <div class="mb-3">
            <label>Category</label>

            <input type="text" name="category" value="{{ product.category }}" class="form-control" required>
        </div>


        <div class="mb-3">
            <label>Price</label>
            <input type="number" name="price" value="{{ product.price }}" class="form-control" step="0.01" required>
        </div>


        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" name="qty" value="{{ product.qty }}" class="form-control" required>
        </div>


        <div class="mb-3">

            <label>Current Image</label>

            <br>

            {% if product.image %}

                <img src="{{ product.image.url }}" width="100" height="100" style="object-fit: cover;">

            {% else %}
                No Image
            {% endif %}

        </div>


        <div class="mb-3">

            <label>New Image</label>

            <input type="file" name="image" class="form-control">

        </div>


        <div class="mb-3">

            <label>Status</label>

            <select name="status" class="form-control">

                <option value="Stock"
                    {% if product.status == 'Stock' %}
                        selected
                    {% endif %}>
                    Stock
                </option>


                <option value="Out of Stock"
                    {% if product.status == 'Out of Stock' %}
                        selected
                    {% endif %}>
                    Out of Stock
                </option>

            </select>

        </div>


        <button type="submit" class="btn btn-primary">Update Product</button>

        <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>

    </form>

</div>

{% endblock %}
