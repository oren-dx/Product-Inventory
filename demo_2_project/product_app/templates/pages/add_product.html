{% extends 'master/base.html' %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="container">

    <h2>Add Product</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>


        <div class="mb-3">
            <label>Category</label>
            <input
                type="text"
                name="category"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label>Price</label>
            <input
                type="number"
                name="price"
                step="0.01"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label>Quantity</label>
            <input
                type="number"
                name="qty"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label>Product Image</label>
            <input
                type="file"
                name="image"
                class="form-control"
            >
        </div>


        <div class="mb-3">
            <label>Status</label>

            <select name="status" class="form-control" required>

                <option value="">
                    Select Status
                </option>

                <option value="Available">
                    Available
                </option>

                <option value="Out of Stock">
                    Out of Stock
                </option>

            </select>

        </div>


        <button type="submit" class="btn btn-primary">Add Product</button>

        <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>

    </form>

</div>

{% endblock %}
